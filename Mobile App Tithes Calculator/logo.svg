<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d9488" />
            <stop offset="100%" stop-color="#0f766e" />
        </linearGradient>
        <!-- Heart/Cross Accent Gradient -->
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>
        <!-- Soft Shadow -->
        <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
        </filter>
    </defs>

    <!-- Base Circle -->
    <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#dropShadow)" />
    
    <!-- Outer Decorative Ring -->
    <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" />

    <!-- Heart Symbol (Love & Investment) -->
    <path d="M256 410 s-130 -75 -130 -165 a70 70 0 0 1 120 -45 a70 70 0 0 1 120 45 c0 90 -110 165 -110 165 z" fill="#ffffff" opacity="0.95" />

    <!-- Cross Symbol inside Heart (Tithes & Faith) -->
    <path d="M241 185 h30 v40 h40 v30 h-40 v80 h-30 v-80 h-40 v-30 h40 z" fill="url(#accentGrad)" />
</svg>
