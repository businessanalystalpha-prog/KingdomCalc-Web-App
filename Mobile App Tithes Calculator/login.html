<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingdomCalc - App Lock</title>

    <!-- PWA & Favicon -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#005f56">
    <link rel="icon" type="image/svg+xml" href="logo.svg">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <img src="logo.svg" alt="KingdomCalc Logo" class="login-logo">
                <h1>KingdomCalc</h1>
                <span class="brand-subtitle">by JK Corporation</span>
            </div>

            <div class="lock-icon-wrapper">
                <i class="fa-solid fa-shield-halved lock-icon"></i>
            </div>

            <h2 id="loginTitle">Enter Passcode</h2>
            <p id="loginSubtitle">Please enter your 4-digit PIN to access your data.</p>

            <div class="pin-input-group">
                <input type="password" maxlength="1" class="pin-digit" id="pin1" inputmode="numeric" autofocus autocomplete="off">
                <input type="password" maxlength="1" class="pin-digit" id="pin2" inputmode="numeric" autocomplete="off">
                <input type="password" maxlength="1" class="pin-digit" id="pin3" inputmode="numeric" autocomplete="off">
                <input type="password" maxlength="1" class="pin-digit" id="pin4" inputmode="numeric" autocomplete="off">
            </div>

            <div id="loginErrorMsg" class="error-message"></div>

            <button id="btnLogin" class="btn-login">
                <i class="fa-solid fa-unlock"></i> Unlock App
            </button>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
